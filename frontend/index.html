<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather Platform</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main>
      <header>
        <h1>🌦 Weather Platform</h1>
        <p>Get weather information for any city.</p>
      </header>

      <section>
        <h2>Search Weather</h2>

        <input id="city-input" type="text" placeholder="Enter city name" />

        <button id="search-btn">Search</button>
      </section>

      <section>
        <h2>Weather Details</h2>

        <div class="weather-card">
          <p><strong>Temperature:</strong> <span id="temperature">--</span></p>

          <p><strong>Humidity:</strong> <span id="humidity">--</span></p>

          <p><strong>Wind Speed:</strong> <span id="wind">--</span></p>

          <p><strong>Condition:</strong> <span id="condition">--</span></p>
        </div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
